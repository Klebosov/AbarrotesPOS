<div class="login-container">
  <div class="card login-card">
    <div class="card-body">
      <h3 class="text-center mb-4">🔐 Sistema de Login</h3>
      
      <!-- Indicador de carga -->
      <div *ngIf="isLoading" class="loading-overlay">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-2">{{ detectionStatus }}</p>
      </div>

      <!-- Pestañas de login -->
      <ul class="nav nav-tabs mb-3" id="loginTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="normal-tab" data-bs-toggle="tab" 
                  data-bs-target="#normal" type="button" role="tab">
            📝 Login Normal
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="facial-tab" data-bs-toggle="tab" 
                  data-bs-target="#facial" type="button" role="tab">
            👤 Login Facial
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <!-- Login Normal -->
        <div class="tab-pane fade show active" id="normal" role="tabpanel">
          <form (ngSubmit)="login()">
            <div class="mb-3">
              <label class="form-label">Usuario</label>
              <input type="text" class="form-control" placeholder="Ingresa tu usuario"
                     [(ngModel)]="uss" name="uss" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" placeholder="Ingresa tu contraseña"
                     [(ngModel)]="password" name="password" required>
            </div>

            <button class="btn btn-primary w-100" type="submit" [disabled]="isLoading">
              Iniciar Sesión
            </button>
          </form>
        </div>

        <!-- Login Facial -->
        <div class="tab-pane fade" id="facial" role="tabpanel">
          <!-- Área de video -->
          <div class="video-container position-relative">
            <video #video class="video-element" autoplay muted playsinline></video>
            <canvas #canvas class="canvas-overlay"></canvas>
            
            <div class="status-badge" [class.active]="cameraActive">
              {{ detectionStatus || (cameraActive ? 'Cámara activa' : 'Cámara inactiva') }}
            </div>
          </div>

          <div class="mt-3">
            <div class="mb-3">
              <label class="form-label">Usuario (para registro)</label>
              <input type="text" class="form-control" placeholder="Ingresa tu usuario"
                     [(ngModel)]="uss" name="ussFacial">
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-secondary" (click)="startCamera()" 
                      [disabled]="cameraActive || isLoading">
                📷 Activar Cámara
              </button>
              
              <button class="btn btn-warning" (click)="registerFace()" 
                      [disabled]="!cameraActive || isLoading">
                📸 Registrar Rostro
              </button>
              
              <button class="btn btn-success" (click)="loginFace()" 
                      [disabled]="!cameraActive || isLoading">
                🚀 Login Facial
              </button>

              <button class="btn btn-danger" (click)="stopCamera()" 
                      *ngIf="cameraActive" [disabled]="isLoading">
                🛑 Detener Cámara
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
